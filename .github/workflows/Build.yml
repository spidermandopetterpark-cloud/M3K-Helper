name: Build M3K Helper

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build M3K Helper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Show Android 37 packages
        run: |
          echo "=== Android 37 packages ==="
          sdkmanager --list | grep -E \
            "platforms;android-37|platforms;android-37\.0|platforms;android-37\.1" \
            || true

      - name: Install Android SDK 37
        run: |
          sdkmanager "platforms;android-37"
          sdkmanager "platform-tools"

      - name: Verify Android SDK 37
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo ""
          echo "=== Installed platforms ==="
          ls -lah "$ANDROID_HOME/platforms"

          echo ""
          echo "=== Android 37 ==="
          ls -lah "$ANDROID_HOME/platforms/android-37"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Show Gradle version
        run: ./gradlew --version

      - name: Clean
        run: ./gradlew clean --stacktrace

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M3K-Helper-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
