name: Build M3K Helper

on:
  push:
    branches:
      - main
      - master

  pull_request:

  workflow_dispatch:

jobs:
  build:
    name: Build M3K Helper
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Show SDK information
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo ""
          echo "Installed platforms:"
          ls -la "$ANDROID_HOME/platforms" || true
          echo ""
          echo "Available Android platforms:"
          sdkmanager --list | grep -E "platforms;android-[0-9]+" | head -80

      - name: Accept licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Install platform tools
        run: |
          sdkmanager "platform-tools"

      - name: Verify API 37
        run: |
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            echo "=============================================="
            echo "ERRO: Android SDK Platform 37 não está disponível"
            echo "=============================================="
            echo ""
            echo "Plataformas instaladas:"
            ls -la "$ANDROID_HOME/platforms" || true
            echo ""
            echo "Pacotes encontrados:"
            sdkmanager --list | grep -E "android-37|android-36|android-35" || true
            exit 1
          fi

          echo "Android SDK 37 encontrado!"

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Check Gradle
        run: ./gradlew --version

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M3K-Helper-debug
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
